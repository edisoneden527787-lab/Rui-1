name: 編譯 APK
on:
  push:
    paths:
      - "generated/**"
      - "server/**"
      - "worker/**"
      - "docker-compose.yml"
      - "README-RUI-AI-APK-BUILDER.md"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-generated-apk-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build:
    name: 雲端編譯
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4
      - name: 設定 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 確認 Android 專案
        run: |
          set -euo pipefail
          test -f generated/settings.gradle.kts
      - name: 安裝 Android 命令列工具
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          wget -q -O /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: 安裝 Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$ANDROID_HOME" > generated/local.properties
      - name: 安裝 Gradle
        run: |
          wget -q -O /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"
      - name: 編譯 Debug APK
        working-directory: generated
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: 找出 APK
        run: |
          set -euo pipefail
          APK=$(find generated -type f -path '*/outputs/apk/debug/*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/ai-app-debug.apk"
          ls -lh "$RUNNER_TEMP/ai-app-debug.apk"
      - name: 上傳 APK 編譯產物
        uses: actions/upload-artifact@v4
        with:
          name: rui-ai-apk
          path: ${{ runner.temp }}/ai-app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: 建立可下載 APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dist-grabber-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$RUNNER_TEMP/ai-app-debug.apk" \
            --title "DIST Grabber ${GITHUB_RUN_NUMBER}" \
            --notes "DIST Grabber Android APK；由 GitHub Actions 雲端編譯。"
